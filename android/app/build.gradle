apply plugin: 'com.android.application'

def resolveGitSha = {
    def propSha = project.findProperty('MYWHALE_GIT_SHA')?.toString()?.trim()
    if (propSha) {
        return propSha
    }
    try {
        def proc = "git rev-parse --short HEAD".execute(null, rootDir.parentFile)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            return proc.text.trim() ?: "unknown"
        }
    } catch (Exception ignored) {
    }
    return "unknown"
}

def resolveBuildTimeUtc = {
    def propTime = project.findProperty('MYWHALE_BUILD_TIME')?.toString()?.trim()
    if (propTime) {
        return propTime
    }
    return java.time.Instant.now().truncatedTo(java.time.temporal.ChronoUnit.SECONDS).toString()
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def injectedStoreFile = project.findProperty('android.injected.signing.store.file')?.toString()?.trim()
def localStoreFile = (keystoreProperties.getProperty('storeFile') ?: System.getenv('ANDROID_KEYSTORE_PATH') ?: '').trim()
def localStorePassword = keystoreProperties.getProperty('storePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
def localKeyAlias = keystoreProperties.getProperty('keyAlias') ?: System.getenv('ANDROID_KEY_ALIAS') ?: ''
def localKeyPassword = keystoreProperties.getProperty('keyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD') ?: ''
def hasLocalReleaseSigning = !localStoreFile.isEmpty() && !localStorePassword.isEmpty() && !localKeyAlias.isEmpty()

android {
    namespace = "com.mywhale.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.mywhale.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ((project.findProperty('MYWHALE_VERSION_CODE') ?: 126).toString().toInteger())
        versionName ((project.findProperty('MYWHALE_VERSION_NAME') ?: "0.1.26").toString())
        buildConfigField "String", "GIT_COMMIT_SHA", "\"${resolveGitSha()}\""
        buildConfigField "String", "BUILD_TIME_UTC", "\"${resolveBuildTimeUtc()}\""
        buildConfigField "String", "RELEASE_CERT_SHA256", "\"49defdc7e1aebdb8d57bdea20b4f5fceac22db53cb121cbaec60b3706e272063\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasLocalReleaseSigning) {
            release {
                storeFile file(localStoreFile)
                storePassword localStorePassword
                keyAlias localKeyAlias
                keyPassword localKeyPassword ?: localStorePassword
            }
        }
    }
    buildTypes {
        release {
            if (hasLocalReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { it.name.toLowerCase().contains('release') && it.project == project }) {
        if (!hasLocalReleaseSigning && !injectedStoreFile) {
            throw new GradleException("Release build requires formal signing credentials (android/keystore.properties, ANDROID_KEYSTORE_* env vars, or -Pandroid.injected.signing.*). Refusing to build unsigned/debug-signed release APK.")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/sherpa-onnx-static-link-onnxruntime-2.0.2.aar')
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def ensureSherpaOnnxAssets = tasks.register('ensureSherpaOnnxAssets') {
    doLast {
        def prebuiltDir = rootProject.file('../vender/sherpa-onnx-prebuilt')
        def aarTarget = file('libs/sherpa-onnx-static-link-onnxruntime-2.0.2.aar')
        if (!aarTarget.exists()) {
            aarTarget.parentFile.mkdirs()
            def localAar = new File(prebuiltDir, 'sherpa-onnx-static-link-onnxruntime-2.0.2.aar')
            if (localAar.exists()) {
                localAar.withInputStream { ins -> aarTarget.withOutputStream { outs -> outs << ins } }
            } else {
                def aarUrl = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.2/sherpa-onnx-static-link-onnxruntime-2.0.2.aar'
                logger.lifecycle("Downloading sherpa-onnx AAR from ${aarUrl}")
                new URL(aarUrl).withInputStream { ins -> aarTarget.withOutputStream { outs -> outs << ins } }
            }
        }

        def ttsTargetDir = file('src/main/assets/tts/default-zh')
        def markerOnnx = new File(ttsTargetDir, 'model.int8.onnx')
        def staleXiaoYa = new File(ttsTargetDir, 'zh_CN-xiao_ya-medium.onnx')
        def bloatEspeak = new File(ttsTargetDir, 'espeak-ng-data')
        if (staleXiaoYa.exists() || bloatEspeak.exists()) {
            ttsTargetDir.deleteDir()
        }
        if (!markerOnnx.exists()) {
            def localUnpacked = new File(prebuiltDir, 'unpacked/kokoro-int8-multi-lang-v1_1')
            if (localUnpacked.exists()) {
                copy {
                    from(localUnpacked) {
                        exclude 'espeak-ng-data/**'
                        exclude 'dict/**'
                        exclude 'lexicon-gb-en.txt'
                    }
                    into ttsTargetDir
                }
            } else {
                def tmpArchive = new File(buildDir, 'tmp/kokoro-int8-multi-lang-v1_1.tar.bz2')
                tmpArchive.parentFile.mkdirs()
                def modelUrl = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_1.tar.bz2'
                logger.lifecycle("Downloading default Kokoro v1.1 INT8 TTS pack from ${modelUrl}")
                new URL(modelUrl).withInputStream { ins -> tmpArchive.withOutputStream { outs -> outs << ins } }
                ttsTargetDir.mkdirs()
                def proc = ['tar', '-xjf', tmpArchive.absolutePath, '--strip-components=1', '-C', ttsTargetDir.absolutePath].execute()
                proc.waitFor()
                if (proc.exitValue() != 0) {
                    throw new GradleException("Failed to extract default-zh TTS pack: ${proc.err.text}")
                }
                new File(ttsTargetDir, 'espeak-ng-data').deleteDir()
                new File(ttsTargetDir, 'dict').deleteDir()
                new File(ttsTargetDir, 'lexicon-gb-en.txt').delete()
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(ensureSherpaOnnxAssets)
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
