apply plugin: 'com.android.application'

def resolveGitSha = {
    def propSha = project.findProperty('MYWHALE_GIT_SHA')?.toString()?.trim()
    if (propSha) {
        return propSha
    }
    try {
        def proc = "git rev-parse --short HEAD".execute(null, rootDir.parentFile)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            return proc.text.trim() ?: "unknown"
        }
    } catch (Exception ignored) {
    }
    return "unknown"
}

def resolveBuildTimeUtc = {
    def propTime = project.findProperty('MYWHALE_BUILD_TIME')?.toString()?.trim()
    if (propTime) {
        return propTime
    }
    return java.time.Instant.now().truncatedTo(java.time.temporal.ChronoUnit.SECONDS).toString()
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def injectedStoreFile = project.findProperty('android.injected.signing.store.file')?.toString()?.trim()
def localStoreFile = (keystoreProperties.getProperty('storeFile') ?: System.getenv('ANDROID_KEYSTORE_PATH') ?: '').trim()
def localStorePassword = keystoreProperties.getProperty('storePassword') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
def localKeyAlias = keystoreProperties.getProperty('keyAlias') ?: System.getenv('ANDROID_KEY_ALIAS') ?: ''
def localKeyPassword = keystoreProperties.getProperty('keyPassword') ?: System.getenv('ANDROID_KEY_PASSWORD') ?: ''
def hasLocalReleaseSigning = !localStoreFile.isEmpty() && !localStorePassword.isEmpty() && !localKeyAlias.isEmpty()

android {
    namespace = "com.mywhale.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.mywhale.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ((project.findProperty('MYWHALE_VERSION_CODE') ?: 117).toString().toInteger())
        versionName ((project.findProperty('MYWHALE_VERSION_NAME') ?: "0.1.17").toString())
        buildConfigField "String", "GIT_COMMIT_SHA", "\"${resolveGitSha()}\""
        buildConfigField "String", "BUILD_TIME_UTC", "\"${resolveBuildTimeUtc()}\""
        buildConfigField "String", "RELEASE_CERT_SHA256", "\"49defdc7e1aebdb8d57bdea20b4f5fceac22db53cb121cbaec60b3706e272063\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasLocalReleaseSigning) {
            release {
                storeFile file(localStoreFile)
                storePassword localStorePassword
                keyAlias localKeyAlias
                keyPassword localKeyPassword ?: localStorePassword
            }
        }
    }
    buildTypes {
        release {
            if (hasLocalReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { it.name.toLowerCase().contains('release') && it.project == project }) {
        if (!hasLocalReleaseSigning && !injectedStoreFile) {
            throw new GradleException("Release build requires formal signing credentials (android/keystore.properties, ANDROID_KEYSTORE_* env vars, or -Pandroid.injected.signing.*). Refusing to build unsigned/debug-signed release APK.")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
