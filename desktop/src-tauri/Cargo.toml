[package]
name = "my-whale"
version = "0.1.24"
description = "Local-first DeepSeek client"
authors = ["my-whale contributors"]
edition = "2021"

[lib]
name = "my_whale_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
base64 = "0.22"
bzip2 = "0.5"
tar = "0.4"
