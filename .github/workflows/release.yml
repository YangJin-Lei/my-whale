name: Release Multi-Platform Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web & sync Android
        working-directory: web
        run: |
          pnpm install
          pnpm build
          CI=true npx cap sync android

      - name: Build Android APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.0}"
          RAW_VER="${TAG_NAME#v}"
          IFS='.' read -r MAJ MIN PAT <<< "${RAW_VER%%-*}"
          VER_CODE=$(( ${MAJ:-0} * 10000 + ${MIN:-1} * 100 + ${PAT:-0} ))
          BUILD_TIME_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p ../release-assets
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Refusing to publish debug-signed release APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
          ./gradlew assembleRelease --no-daemon \
            -PMYWHALE_VERSION_CODE="$VER_CODE" \
            -PMYWHALE_VERSION_NAME="$RAW_VER" \
            -PMYWHALE_GIT_SHA="$SHORT_SHA" \
            -PMYWHALE_BUILD_TIME="$BUILD_TIME_UTC" \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          APK_OUT="../release-assets/my-whale-${TAG_NAME}-android.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_OUT"
          rm -f app/release-keystore.jks
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$APKSIGNER" ]; then
            CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK_OUT")
            echo "$CERT_INFO"
          fi
          APK_SHA256=$(sha256sum "$APK_OUT" | awk '{print $1}')
          printf "%s  my-whale-%s-android.apk\n" "$APK_SHA256" "$TAG_NAME" > "../release-assets/my-whale-${TAG_NAME}-android.apk.sha256"
          {
            echo "tag=$TAG_NAME"
            echo "versionName=$RAW_VER"
            echo "versionCode=$VER_CODE"
            echo "commit=$GITHUB_SHA"
            echo "buildTimeUtc=$BUILD_TIME_UTC"
            echo "apkSha256=$APK_SHA256"
          } > "../release-assets/BUILD_INFO-${TAG_NAME}.txt"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/*

  desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install web & desktop dependencies
        run: |
          pnpm --dir web install
          pnpm --dir desktop install

      - name: Prepare sherpa-onnx TTS runtime and built-in voice pack
        shell: bash
        run: |
          set -euo pipefail
          RES_ROOT="desktop/src-tauri/resources/tts"
          mkdir -p "$RES_ROOT/lib" "$RES_ROOT/default-zh"
          curl -fSL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-melo-tts-zh_en.tar.bz2" -o default-zh.tar.bz2
          tar -xjf default-zh.tar.bz2 --strip-components=1 -C "$RES_ROOT/default-zh"
          rm -rf default-zh.tar.bz2 "$RES_ROOT/default-zh/dict" "$RES_ROOT/default-zh/model.int8.onnx"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            LIB_ARCHIVE="sherpa-onnx-v2.0.2-win-x64-shared-MD-MinSizeRel-lib.tar.bz2"
            EXT="dll"
          else
            LIB_ARCHIVE="sherpa-onnx-v2.0.2-osx-arm64-shared-lib.tar.bz2"
            EXT="dylib"
          fi
          curl -fSL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.2/${LIB_ARCHIVE}" -o sherpa-lib.tar.bz2
          mkdir -p sherpa-lib-unpack
          tar -xjf sherpa-lib.tar.bz2 --strip-components=1 -C sherpa-lib-unpack
          cp -a sherpa-lib-unpack/lib/*."$EXT"* "$RES_ROOT/lib/"
          rm -rf sherpa-lib.tar.bz2 sherpa-lib-unpack

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}

      - name: Collect desktop bundles
        shell: bash
        run: |
          mkdir -p release-assets
          find desktop/src-tauri/target -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \) -exec cp {} release-assets/ \;

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release-assets/*

  publish:
    name: Create GitHub Release
    needs: [android, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd all-artifacts
          sha256sum *.apk *.exe *.msi *.dmg > SHA256SUMS.txt || sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/*
          generate_release_notes: true
