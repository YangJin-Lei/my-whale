name: Release Multi-Platform Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web & sync Android
        working-directory: web
        run: |
          pnpm install
          pnpm build
          CI=true npx cap sync android

      - name: Build Android APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.0}"
          RAW_VER="${TAG_NAME#v}"
          IFS='.' read -r MAJ MIN PAT <<< "${RAW_VER%%-*}"
          VER_CODE=$(( ${MAJ:-0} * 10000 + ${MIN:-1} * 100 + ${PAT:-0} ))
          mkdir -p ../release-assets
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
            ./gradlew assembleRelease --no-daemon \
              -PMYWHALE_VERSION_CODE="$VER_CODE" \
              -PMYWHALE_VERSION_NAME="$RAW_VER" \
              -Pandroid.injected.signing.store.file="$(pwd)/app/release-keystore.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk "../release-assets/my-whale-${TAG_NAME}-android.apk"
          else
            ./gradlew assembleDebug --no-daemon \
              -PMYWHALE_VERSION_CODE="$VER_CODE" \
              -PMYWHALE_VERSION_NAME="$RAW_VER"
            cp app/build/outputs/apk/debug/app-debug.apk "../release-assets/my-whale-${TAG_NAME}-android-debug.apk"
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/*.apk

  desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install web & desktop dependencies
        run: |
          pnpm --dir web install
          pnpm --dir desktop install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}

      - name: Collect desktop bundles
        shell: bash
        run: |
          mkdir -p release-assets
          find desktop/src-tauri/target -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" \) -exec cp {} release-assets/ \;

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release-assets/*

  publish:
    name: Create GitHub Release
    needs: [android, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/*
          generate_release_notes: true
